[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goosen-world"
version = "0.1.0"
description = "Reproducible geodata-to-Blender tiles for GÅSEN, Trelleborg"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "rasterio>=1.4,<2", "pyproj>=3.7,<4", "shapely>=2.1,<3", "requests>=2.32,<3", "scipy>=1.14,<2", "pillow>=11,<13", "laspy[lazrs]>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
earthengine = ["earthengine-api>=1.5,<2"]

[project.scripts]
goosen = "goosen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
